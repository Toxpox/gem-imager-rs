name: Redirect GitHub Pages to T3 Gemstone documentation

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Create redirect page
        run: |
          mkdir -p _site
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=https://docs.t3gemstone.org/">
              <link rel="canonical" href="https://docs.t3gemstone.org/">
              <title>T3 Gemstone Documentation</title>
            </head>
            <body>
              <p>Documentation has moved to <a href="https://docs.t3gemstone.org/">docs.t3gemstone.org</a>.</p>
              <script>window.location.replace('https://docs.t3gemstone.org/');</script>
            </body>
          </html>
          EOF

      - name: Upload redirect page
        uses: actions/upload-pages-artifact@v5
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
