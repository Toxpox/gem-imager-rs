name: Run PR Tests

on:
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest, macos-26-intel]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        lfs: true
    - name: Install dependencies
      if: startsWith(matrix.os, 'ubuntu')
      run: make setup-debian-deps
    - name: Select rust toolchain
      run: rustup toolchain install stable --profile minimal
    - name: Add rustfmt and clippy
      run: rustup component add rustfmt clippy
    - name: Use caching
      uses: Swatinem/rust-cache@v2
    - name: Run checks
      run: make check
    - name: Run tests
      run: make test

  # `rust-version` is a promise to anyone building from source, but every other job installs
  # `stable`, so nothing ever checked it. It was declared 1.88 while the tree needed 1.95, and the
  # only way to find out was for a user on an older toolchain to hit it. Pin the declared version
  # explicitly so the promise is tested rather than asserted.
  msrv:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        lfs: true
    - name: Install dependencies
      run: make setup-debian-deps
    - name: Read declared MSRV
      id: msrv
      run: |
        set -euo pipefail
        version=$(cargo metadata --format-version 1 --no-deps | python3 -c '
        import json, sys
        pkgs = json.load(sys.stdin)["packages"]
        declared = {p["rust_version"] for p in pkgs if p.get("rust_version")}
        missing = sorted(p["name"] for p in pkgs if not p.get("rust_version"))
        if missing:
            sys.exit("workspace crates without rust-version: " + ", ".join(missing))
        if len(declared) != 1:
            sys.exit("workspace crates disagree on rust-version: " + ", ".join(sorted(declared)))
        print(declared.pop())
        ')
        echo "Declared MSRV: ${version}"
        echo "version=${version}" >> "$GITHUB_OUTPUT"
    - name: Select rust toolchain
      run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal
    - name: Use caching
      uses: Swatinem/rust-cache@v2
    - name: Check workspace on declared MSRV
      run: cargo +${{ steps.msrv.outputs.version }} check --workspace --all-features --locked

  cargo-deny:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        checks:
          - advisories
          - bans licenses sources

    # Do not break CI for advisories. This is useful since even if I create a PR to fix things 
    # upstream, it will take a while to get merged. In most cases, it is fine to wait.
    continue-on-error: ${{ matrix.checks == 'advisories' }}

    steps:
    - uses: actions/checkout@v7
    - uses: EmbarkStudios/cargo-deny-action@v2
      with:
        command: check ${{ matrix.checks }}

  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Build preview
        run: docker run -v $PWD:/antora:Z --rm -t ghcr.io/beagleboard/antora-docker:main antora-playbook-local.yml --fetch --stacktrace

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload public folder
          path: './build/site'
