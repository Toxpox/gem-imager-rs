name: Create Release artifacts

on:
  push:
    branches: [ "main" ]
    tags: [ "[0-9]+.[0-9]+.[0-9]+" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  VERBOSE: 1
  PRE_RELEASE: ${{ github.ref_type != 'tag' && '1' || '0' }}
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
  APPIMAGE_RELEASE_TAG: ${{ github.ref_type == 'tag' && 'latest' || 'continuous-release' }}

defaults:
  run:
    shell: bash

jobs:
  linux-native-job:
    strategy:
      matrix:
        platform: [ ubuntu-22.04, ubuntu-22.04-arm ]
    name: Build Artifacts - ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        lfs: true

    - name: Select rust toolchain
      run: rustup toolchain install stable --profile minimal

    - name: Use caching
      uses: Swatinem/rust-cache@v2
        
    - name: Build packages
      run: make setup-debian-deps setup-packaging-deps package-host

    # Do not do versioning for Pre-Release packages
    - name: Rename Pre-Release Packages
      if: github.ref_type != 'tag'
      run: make package-rename

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: artifacts-${{ matrix.platform }}
        path: |
          gem-imager-gui/dist/*
          gem-imager-cli/dist/*

  linux-snap-job:
    strategy:
      matrix:
        platform: [ubuntu-24.04, ubuntu-24.04-arm]
    name: Build Snaps - ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        lfs: true

    - name: Use caching
      uses: Swatinem/rust-cache@v2
    - run: make vendor

    - run: echo PRE_RELEASE=$PRE_RELEASE > .envrc

    - run: ln -sf snapcraft.gui.yaml snapcraft.yaml
    - uses: snapcore/action-build@v1
      id: build-gui

    - run: ln -sf snapcraft.cli.yaml snapcraft.yaml
    - uses: snapcore/action-build@v1
      id: build-cli

    # The built file is taken from the action's output rather than matched by a glob: the snap
    # is named after `name:` in the recipe, which is not the crate directory name.
    - name: Move to dist folders
      run: |
        mkdir -p gem-imager-cli/dist/
        mkdir -p gem-imager-gui/dist/
        mv "${{ steps.build-cli.outputs.snap }}" gem-imager-cli/dist/
        mv "${{ steps.build-gui.outputs.snap }}" gem-imager-gui/dist/

    # Do not do versioning for Pre-Release packages
    - name: Rename Pre-Release Packages
      if: github.ref_type != 'tag'
      run: make package-rename

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: artifacts-snap-${{ matrix.platform }}
        path: |
          gem-imager-gui/dist/*
          gem-imager-cli/dist/*

  linux-snap-cross-job:
    strategy:
      matrix:
        platform: [armhf, riscv64]
    name: Build CLI Snap - ${{matrix.platform}}
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        lfs: true

    - uses: docker/setup-qemu-action@v4

    - name: Use caching
      uses: Swatinem/rust-cache@v2

    - run: make vendor
    - run: ln -sf snapcraft.cli.yaml snapcraft.yaml
    - uses: canonical/snapcraft-multiarch-action@v1
      id: build-cli
      with:
        architecture: ${{ matrix.platform }}

    - name: Move to dist folders
      run: |
        mkdir -p gem-imager-cli/dist/
        mv "${{ steps.build-cli.outputs.snap }}" gem-imager-cli/dist/

    # Do not do versioning for Pre-Release packages
    - name: Rename Pre-Release Packages
      if: github.ref_type != 'tag'
      run: make package-rename

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: artifacts-snap-cli-${{ matrix.platform }}
        path: |
          gem-imager-cli/dist/*

  linux-cross-job:
    strategy:
      matrix:
        platform: [armv7-unknown-linux-gnueabihf]
    name: Build Artifacts - ${{matrix.platform}}
    runs-on: ubuntu-24.04
    env:
      NO_BUILD: 1
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        lfs: true

    - name: Build binary
      uses: houseabsolute/actions-rust-cross@v1
      with:
        command: build
        target: ${{matrix.platform}}
        args: "--locked --release -F dfu -p gem-imager-cli"

    - name: Build packages
      run: make setup-packaging-deps package-${{matrix.platform}}

    # Do not do versioning for Pre-Release packages
    - name: Rename Pre-Release Packages
      if: github.ref_type != 'tag'
      run: make package-rename

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: artifacts-${{matrix.platform}}
        path: |
          gem-imager-cli/dist/*

  vendor-deps:
    name: Vendor dependencies
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Create dependency tar
      run: make vendor-deps
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: vendor-deps
        path: cargo-vendor.tar.zst

  macos-job:
    name: Build MacOS Artifacts
    runs-on: macos-latest
    # Surfaced as job-level env so the signing step can test whether it is set: the `secrets`
    # context is not available in a step-level `if:`, but `env` is.
    env:
      TEAM_ID: ${{ secrets.TEAM_ID }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        lfs: true

    - name: Setup rust toolchain
      run: |
        rustup toolchain install stable --profile minimal
        rustup target add aarch64-apple-darwin x86_64-apple-darwin

    - name: Use caching
      uses: Swatinem/rust-cache@v2
        
    # The ENV variable names are what cargo-packager requires.
    # Skipped when TEAM_ID is unset, as it is on forks without the signing secrets: writing an
    # empty `signing_identity` makes cargo-packager fail rather than fall back to unsigned.
    - name: Setup macos signing
      working-directory: gem-imager-gui
      if: github.event_name != 'pull_request' && env.TEAM_ID != ''
      run: |
        echo "" >> Cargo.toml
        echo "[package.metadata.packager.macos]" >> Cargo.toml
        echo "signing_identity = \"${{ secrets.TEAM_ID }}\"" >> Cargo.toml

    - name: Build packages
      env:
        APPLE_CERTIFICATE: ${{ secrets.CERT_DEVELOPER_APP_BASE64 }}
        APPLE_CERTIFICATE_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_PASSWORD: ${{ secrets.APP_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.TEAM_ID }}
      run: make setup-packaging-deps package-x86_64-apple-darwin package-aarch64-apple-darwin

    # Audits the finished dmg rather than the intermediate bundle, so a packaging regression
    # cannot reach users as an app that dies at launch with an unhelpful dialog.
    - name: Verify dmg is self-contained
      run: |
        brew install p7zip
        shopt -s nullglob
        dmgs=(gem-imager-gui/dist/*.dmg)
        # Without this check a packaging regression that produces no dmg would surface as
        # verify-macos-dmg.sh failing on the literal glob text, hiding the real cause.
        if [ "${#dmgs[@]}" -eq 0 ]; then
          echo "::error::packaging produced no .dmg in gem-imager-gui/dist"
          exit 1
        fi
        for dmg in "${dmgs[@]}"; do
          ./scripts/verify-macos-dmg.sh "$dmg"
        done

    # Do not do versioning for Pre-Release packages
    - name: Rename Pre-Release Packages
      if: github.ref_type != 'tag'
      run: make package-rename

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: artifacts-macos
        path: |
          gem-imager-gui/dist/*
          !gem-imager-gui/dist/*.app

  windows-job:
    name: Build Windows Artifacts
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        lfs: true

    - uses: microsoft/setup-WinAppCli@v0.2

    - name: Setup rust toolchain
      run: |
        rustup toolchain install stable --profile minimal
        rustup target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc
        winapp pack --help

    - name: Use caching
      uses: Swatinem/rust-cache@v2

    # cargo-packager fetches the WIX3 toolchain from GitHub on every run and has no retry, so a
    # single dropped TLS connection fails the whole Windows release. Caching the extracted tools
    # keeps later runs off the network entirely.
    - name: Cache WIX toolset
      id: wix-cache
      uses: actions/cache@v4
      with:
        # cargo-packager resolves this as `dirs::cache_dir()/.cargo-packager/WixTools`, which is
        # %LOCALAPPDATA% on Windows. Written with `~` because the `env` context only exposes
        # variables declared in the workflow, not the runner's own environment.
        path: ~\AppData\Local\.cargo-packager\WixTools
        key: ${{ runner.os }}-wix3-3112rtm-2c1888d5

    # Fetch the tools here instead of letting cargo-packager do it: this retries and verifies the
    # published checksum, so a transient network error retries rather than aborting the build.
    #
    # This runs even on a cache hit, because it also validates the restored directory. A partial
    # cache satisfies `cache-hit` but not cargo-packager, which then silently falls back to its
    # own unretried download: the exact failure this step exists to prevent. The file list and
    # checksum below mirror WIX_REQUIRED_FILES and WIX_SHA256 in cargo-packager 0.11.8.
    - name: Prefetch and verify WIX toolset
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $url = 'https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311-binaries.zip'
        $expected = '2c1888d5d1dba377fc7fa14444cf556963747ff9a0a289a3599cf09da03b9e2e'
        $dest = "$env:LOCALAPPDATA\.cargo-packager\WixTools"
        $zip = Join-Path $env:RUNNER_TEMP 'wix311-binaries.zip'
        $required = @(
          'candle.exe', 'candle.exe.config', 'darice.cub', 'light.exe', 'light.exe.config',
          'wconsole.dll', 'winterop.dll', 'wix.dll', 'WixUIExtension.dll', 'WixUtilExtension.dll'
        )

        function Test-WixComplete {
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $dest $_)) }
          if ($missing) {
            Write-Host "WixTools is incomplete, missing: $($missing -join ', ')"
            return $false
          }
          return $true
        }

        if (Test-WixComplete) {
          Write-Host "WIX toolset restored from cache at $dest"
          exit 0
        }

        # A partial directory makes cargo-packager delete and refetch without retries, so clear it
        # here and let the retry loop below own the download.
        if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }

        foreach ($attempt in 1..5) {
          try {
            Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing -TimeoutSec 120
            $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLower()
            if ($hash -ne $expected) { throw "checksum mismatch: got $hash" }
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Expand-Archive -Path $zip -DestinationPath $dest -Force
            if (-not (Test-WixComplete)) { throw "archive did not contain the expected tools" }
            Write-Host "WIX toolset ready at $dest"
            exit 0
          } catch {
            Write-Host "attempt ${attempt} failed: $($_.Exception.Message)"
            if ($attempt -eq 5) { throw }
            if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
            Start-Sleep -Seconds ([Math]::Pow(2, $attempt))
          }
        }

    - name: Build packages
      run: make setup-packaging-deps package-aarch64-pc-windows-msvc package-x86_64-pc-windows-msvc package-bundle-pc-windows-msvc

    # Do not do versioning for Pre-Release packages
    - name: Rename Pre-Release Packages
      if: github.ref_type != 'tag'
      run: make package-rename

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: artifacts-windows
        path: |
          gem-imager-gui/dist/*

  release:
    name: Upload Release artifacts
    needs:
      - linux-native-job
      - linux-cross-job
      - linux-snap-job
      - linux-snap-cross-job
      - macos-job
      - windows-job
      - vendor-deps
    runs-on: ubuntu-latest
    # Creating a release writes to the repository, which the default GITHUB_TOKEN cannot do when
    # the repo's workflow permissions are set to read-only.
    permissions:
      contents: write
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAP_STORE_LOGIN }}
      SNAP_CHANNEL: ${{ github.ref_type == 'tag' && 'stable' || 'edge' }}
    if: github.event_name != 'pull_request'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -laR artifacts

      - name: Create Pre-Release
        # Only the mainline publishes to the shared `continuous-release` tag. Builds from other
        # branches still produce downloadable job artifacts, but must not overwrite the release
        # that users download.
        if: github.ref_type != 'tag' && github.ref_name == 'main'
        uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          name: Continuous Release
          tag_name: continuous-release
          files: artifacts/**

      - name: Create Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/**

      # The three snap-store steps only run where store credentials exist. On a fork without
      # SNAP_STORE_LOGIN, `snapcraft upload` would abort the whole release job even though the
      # GitHub release itself was published successfully. They are also limited to the mainline
      # and tags so that test builds from other branches cannot push to the snap store.
      - name: Install Snapcraft
        if: env.SNAPCRAFT_STORE_CREDENTIALS != '' && (github.ref_name == 'main' || github.ref_type == 'tag')
        uses: samuelmeuli/action-snapcraft@v3

      # TODO: Publish CLI
      - name: Publish Snaps
        if: env.SNAPCRAFT_STORE_CREDENTIALS != '' && (github.ref_name == 'main' || github.ref_type == 'tag')
        run: |
          for pkg in gui; do
            for file in artifacts/gem-imager-$pkg/dist/*.snap; do
              snapcraft upload "$file" --release=$SNAP_CHANNEL;
            done
          done

      - name: Logout from snapcraft
        if: env.SNAPCRAFT_STORE_CREDENTIALS != '' && (github.ref_name == 'main' || github.ref_type == 'tag')
        run: snapcraft logout

  publish-aur:
    name: Publish Package to AUR
    runs-on: ubuntu-latest
    needs:
      - release
    # Skipped without an AUR deploy key, which forks do not have: shimataro/ssh-key-action fails
    # outright on an empty key rather than no-opping.
    if: github.ref_type == 'tag' && vars.PUBLISH_AUR == 'true'
    steps:
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.AUR_SSH_KEY }}
          # AUR SSH fingerprint: https://aur.archlinux.org/
          known_hosts: 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN'

      - name: Setup git
        run: |
          git config --global user.email "dev@t3gemstone.org"
          git config --global user.name "T3 Gemstone Devteam"

      - name: Clone AUR repo
        run: git clone ssh://aur@aur.archlinux.org/gem-imager-cli.git $GITHUB_WORKSPACE

      - name: Validate package
        uses: heyhusen/archlinux-package-action@v2
        with:
          updpkgsums: true
          srcinfo: true
          namcap: true
          pkgver: ${{github.ref_name}}

      - name: Push
        run: |
          git diff
          git add .SRCINFO PKGBUILD
          git commit -m "Update to $VERSION"
          git push
