[package]
name = "bb-imager-gui"
description = "The easiest way to install the latest operating system images for your T3 Gemstone board."
version.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
iced = { version = "0.14.0", features = ["image", "svg", "tokio", "advanced", "canvas"] }
rfd = { version = "0.17.2", features = ["file-handle-inner"] }
bb-flasher = { path = "../bb-flasher", features = ["serde", "piped_image"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing = "0.1.44"
iced_aw = { version = "0.14.1", default-features = false, features = ["spinner"] }
image = "0.25"
tokio = { version = "1.52", default-features = false, features = ["macros", "time"] }
webbrowser = "1.2.1"
notify-rust = { version = "4.17.0", default-features = false, features = ["z-with-tokio"], optional = true }
url = "2.5.4"
whoami = "2.1"
iana-time-zone = "0.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150" }
directories = "6.0.0"
bb-downloader = { path = "../bb-downloader", default-features = false, features = ["json"] }
bb-config = { path = "../bb-config" }
bb-helper = { path = "../bb-helper", features = ["file_stream", "cancel"] }
semver = "1.0.28"
anyhow = "1.0"
tempfile = "3.26"
const-hex = { version = "1.19", features = ["serde"] }
tokio-util = { version = "0.7", features = ["rt"] }
rusqlite = { version = "0.40", features = ["url", "chrono"] }
chrono = "0.4"
chrono-tz = { version = "0.10", features = ["serde"] }
bb-iced-widgets = { path = "../bb-iced-widgets" }
bb-i18n = { path = "../bb-i18n" }
bb-winusb = { path = "../bb-winusb", optional = true }
thiserror = "2.0"

# Free-space pre-check for the DFU staging image, and (on Windows) sleep inhibition while a write
# is running. Both are single platform calls, which is why they are made directly rather than
# through another abstraction layer.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Power"] }

[build-dependencies]
embed-resource = "3.0"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
bb-flasher = { path = "../bb-flasher", features = ["sd_linux_udev"] }
ashpd = { version = "0.13", features = ["notification"] }

[target.'cfg(target_os = "macos")'.dependencies]
bb-flasher = { path = "../bb-flasher", features = ["sd_macos_authopen"] }

[features]
default = ["static"]
sd = ["bb-flasher/sd"]
# USB DFU writes to onboard eMMC. Implies `sd`: the DFU path stages the image through the SD
# writer so the first-boot file lands in the same FAT partition it would on a card.
dfu = ["bb-flasher/dfu", "sd"]
# Windows 11 x64 beta: detect the exact T3 ROM DFU devnode and provision WinUSB through the
# separately elevated, consoleless helper. Kept explicit until the clean-VM release gates pass.
dfu-driver-mvp = ["dfu", "dep:bb-winusb"]
# Handle application updates
updater = []
static = ["rusqlite/bundled", "bb-flasher/static", "bb-downloader/rustls"]
system-deps = ["bb-downloader/native-tls"]
pre-release = []
notify-rust = ["dep:notify-rust"]
debug = ["iced/hot"]

[package.metadata.packager]
icons = ["assets/icons/icon.*"]
category = "DeveloperTool"
identifier = "org.t3gemstone.imager"
out_dir = "dist"
product_name = "T3 Gemstone Imager"

[package.metadata.packager.wix]
banner_path = "assets/icons/installer_banner.png"
dialog_image_path = "assets/icons/dialog_image.png"

[package.metadata.packager.deb]
package_name = "bb-imager-gui"
files = { "assets/packages/linux/udev/10-t3gemstone.rules" = "/etc/udev/rules.d/10-t3gemstone.rules" }

[package.metadata.packager.pacman]
files = { "assets/packages/linux/udev/10-t3gemstone.rules" = "/etc/udev/rules.d/10-t3gemstone.rules" }
