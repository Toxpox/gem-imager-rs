[package]
name = "gem-imager-cli"
description = "A streamlined tool for creating, flashing, and managing OS images for BeagleBoard devices."
version.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[build-dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.6"
clap_mangen = "0.3"

[dev-dependencies]
tempfile = "3.27"
# `mock_sd` provides a real MBR + FAT32 image, which lets the integration tests
# drive `flash sd` end-to-end against a file destination.
gem-flasher-sd = { path = "../gem-flasher-sd", features = ["mock_sd"] }

[dependencies]
clap = { version = "4.5", features = ["derive"] }
gem-flasher = { path = "../gem-flasher", features = ["sd"] }
indicatif = "0.18"
console = "0.16"
clap_complete = "4.6"
anyhow = "1.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing = "0.1.44"

[features]
default = []
dfu = ["gem-flasher/dfu"]

[package.metadata.packager]
category = "DeveloperTool"
out_dir = "dist"

[package.metadata.packager.linux]
generate_desktop_entry = false

[package.metadata.packager.deb.files]
"dist/.target/man" = "/usr/share/man/man1"
"dist/.target/shell-comp/_gem-imager-cli" = "/usr/share/zsh/site-functions/_gem-imager-cli"
"dist/.target/shell-comp/gem-imager-cli.bash" = "/usr/share/bash-completion/gem-imager-cli.bash"

[package.metadata.packager.pacman.files]
"dist/.target/man" = "/usr/share/man/man1"
"dist/.target/shell-comp/_gem-imager-cli" = "/usr/share/zsh/site-functions/_gem-imager-cli"
"dist/.target/shell-comp/gem-imager-cli.bash" = "/usr/share/bash-completion/gem-imager-cli.bash"
