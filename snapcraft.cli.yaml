name: t3gemstone-imager-cli
title: T3 Gemstone Imager CLI
base: core24 # the base snap is the execution environment for this snap
version: 1.0.13
license: MIT
contact:
  - https://docs.t3gemstone.org/en
issues:
  - https://github.com/t3gemstone/imager/issues
website:
  - https://docs.t3gemstone.org
source-code:
  - https://github.com/t3gemstone/imager
summary: Tool for creating, flashing, and managing OS images for T3 Gemstone boards.
description: |
  A streamlined command line tool to write T3 Gemstone OS images to SD cards.

grade: stable
confinement: classic

parts:
  bb-imager-cli:
    # See 'snapcraft plugins'
    plugin: rust
    rust-channel: stable
    source: .
    build-packages:
      - libudev-dev
    build-attributes:
      - enable-patchelf
    override-build: |
      make build-cli install-cli DESTDIR=${CRAFT_PART_INSTALL} PREFIX=/usr
