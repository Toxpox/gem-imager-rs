[package]
name = "bb-flasher"
description = "Library providing flashing capabilities for BeagleBoard.org boards"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
readme = "README.md"
keywords = ["beagle", "flasher"]
categories = ["development-tools", "embedded", "hardware-support"]

[dependencies]
qcow2-core = { git = "https://github.com/Ayush1325/qcow2-forensic.git", branch = "core-reader" }
liblzma = "0.4"
serde = { version = "1.0", features = ["derive"], optional = true }
yaml_serde = { version = "0.10", optional = true }
thiserror = { version = "2.0" }
tracing = "0.1"
bb-flasher-sd = { path = "../bb-flasher-sd", optional = true }
tokio-util = { version = "0.7", optional = true, features = ["rt"] }
bb-helper = { path = "../bb-helper", features = ["cancel"] }
rc-zip-sync = { version = "4.4", default-features = false, features = ["deflate"] }
bb-flasher-dfu = { path = "../bb-flasher-dfu", optional = true }
anyhow = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
liblzma = { version = "0.4", features = ["parallel"] }

[dev-dependencies]
tokio = { version = "1.52", default-features = false, features = ["rt-multi-thread", "macros"] }
tempfile = "3.27"
zip = { version = "8.6", default-features = false }

[features]
default = []
serde = ["dep:serde"]
sd = ["bb-flasher-sd", "serde", "dep:yaml_serde", "bb-helper/reader_progress"]
sd_linux_udev = ["bb-flasher-sd?/udev"]
sd_macos_authopen = ["bb-flasher-sd?/macos_authopen"]
dfu = ["bb-flasher-dfu"]
static = ["liblzma/static"]
piped_image = ["dep:tokio-util", "bb-helper/file_stream"]

[package.metadata.docs.rs]
all-features = true
