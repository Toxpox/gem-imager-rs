[workspace]
resolver = "2"

members = [
	"bb-flasher",
	"bb-imager-cli",
	"bb-imager-gui",
	"bb-flasher-sd",
	"bb-downloader",
	"bb-config",
	"bb-helper",
	"bb-flasher-dfu",
        "bb-drivelist",
        "bb-bmap-parser",
        "bb-iced-widgets"
]

[profile.release]
lto = true
codegen-units = 1

[workspace.package]
version = "1.0.13"
edition = "2024"
authors = ["Ayush Singh <ayush@beagleboard.org>"]
repository = "https://github.com/beagleboard/bb-imager-rs"
license = "MIT"
