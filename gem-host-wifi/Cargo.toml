[package]
name = "gem-host-wifi"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "Detect the host computer's current Wi-Fi network and, on request, read its saved password through native OS APIs only."

[dependencies]
gem-helper = { path = "../gem-helper", features = ["secret"] }
thiserror = "2.0"

# Linux: talk to NetworkManager over the system D-Bus. The blocking API is used deliberately — the
# public crate API is synchronous and the GUI drives it from a blocking task, so pulling in an async
# runtime here would add a dependency for no benefit.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

# Windows: WinRT for the connected SSID and home region, Win32 Native Wi-Fi for the saved profile.
# Aligned with the `windows` 0.62 crate already used by gem-drivelist and gem-flasher-sd.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
	"Networking_Connectivity",
	"System_UserProfile",
	"Foundation_Collections",
	"Win32_Foundation",
	"Win32_NetworkManagement_WiFi",
] }
# Namespace-aware parsing of the Native Wi-Fi profile XML. The plan forbids extracting the key with
# a regex (§7.5), and this is the parser already present in the workspace dependency graph.
roxmltree = "0.20"

# macOS: CoreLocation gates the SSID, CoreWLAN reads it and the country code.
# The profile-XML parser is platform-neutral, so its fixture tests build on every host.
[dev-dependencies]
roxmltree = "0.20"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSArray", "NSData"] }
objc2-core-location = { version = "0.3.2", default-features = false, features = ["std", "CLLocationManager", "CLLocation"] }
objc2-core-wlan = { version = "0.3.2", default-features = false, features = ["std", "CWWiFiClient", "CWInterface", "CoreWLANTypes"] }
